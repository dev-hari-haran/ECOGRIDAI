<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092015" />
      <stop offset="100%" stop-color="#143D28" />
    </linearGradient>

    <!-- Emerald Leaf / Eco Gradient -->
    <linearGradient id="ecoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Solar Energy Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Eco Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Microgrid Bus Network Interconnect Lines -->
  <g stroke="#34D399" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round">
    <line x1="14" y1="20" x2="32" y2="14" />
    <line x1="32" y1="14" x2="50" y2="20" />
    <line x1="14" y1="20" x2="18" y2="44" />
    <line x1="50" y1="20" x2="46" y2="44" />
    <line x1="18" y1="44" x2="32" y2="52" />
    <line x1="46" y1="44" x2="32" y2="52" />
  </g>

  <!-- Network Bus Nodes -->
  <g fill="#10B981" opacity="0.75">
    <circle cx="14" cy="20" r="2.5" />
    <circle cx="32" cy="14" r="3" fill="#34D399" />
    <circle cx="50" cy="20" r="2.5" />
    <circle cx="18" cy="44" r="2.5" />
    <circle cx="46" cy="44" r="2.5" />
    <circle cx="32" cy="52" r="3" fill="#34D399" />
  </g>

  <!-- Eco Leaf Shape (Left Wing of Logo) -->
  <path
    d="M 32 14 C 18 20, 15 38, 32 48 C 30 42, 28 32, 32 24 Z"
    fill="url(#ecoGrad)"
    opacity="0.9"
  />

  <!-- Central AI Energy Lightning Bolt -->
  <path
    d="M 35 15 L 24 33 L 33 33 L 27 50 L 43 29 L 34 29 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />

  <!-- Center Microgrid Pulse Core -->
  <circle cx="32" cy="33" r="2" fill="#FFFBEB" />
</svg>